name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + CMake + accept licenses
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null || true
          "$SDK" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Fetch native deps (whisper.cpp / llama.cpp at pinned commits)
        run: |
          set -e
          fetch() { # $1=url $2=sha $3=dir
            mkdir -p "$3"; cd "$3"
            git init -q
            git remote add origin "$1"
            git fetch -q --depth 1 origin "$2"
            git checkout -q FETCH_HEAD
            git submodule update --init --recursive --depth 1 || true
            cd - > /dev/null
          }
          fetch https://github.com/ggml-org/whisper.cpp.git 371b5a7561823ab2bb32142d2751e35e7534727b third_party/whisper.cpp
          fetch https://github.com/ggml-org/llama.cpp.git a298422da78eb75e440a7de0ca408af64d323d93 third_party/llama.cpp
          echo "whisper:" && ls third_party/whisper.cpp | head -3
          echo "llama:" && ls third_party/llama.cpp | head -3

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少簽署金鑰 Secret（SIGNING_KEYSTORE_B64）。請先到 repo 的 Settings → Secrets and variables → Actions 設定四個 Secret 後再重跑。"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName=5.0.0 -PversionCode=$((50000 + ${{ github.run_number }})) -PciBuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LineCallRecorder-v5-build${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk out/LineCallRecorder-v5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LineCallRecorder-v5-build${{ github.run_number }}
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v5-build-${{ github.run_number }}
          name: v5.0.0 測試版（第 ${{ github.run_number }} 次編譯）
          body: |
            LINE 通話錄音 v5.0.0（以 GPLv3 的 CallVault 為基底的 fork，實驗性，含語音轉文字，之後會移除）。
            與舊版 v1.0／4.0.2 簽章不同，需先移除舊版再裝。穩定的 v1.0 仍是 Latest，不受影響。
          files: out/*.apk
          make_latest: false
